  <rect x="0" y="0" width="10" height="320" fill="#C85B32"/>
  <g fill="none" stroke="#C85B32" stroke-width="2" opacity="0.9">
    <circle cx="1040" cy="160" r="96"/>
    <circle cx="1040" cy="160" r="70" stroke="#29347B" opacity="0.55"/>
    <circle cx="1040" cy="160" r="44" opacity="0.55"/>
